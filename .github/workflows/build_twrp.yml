name: Build TWRP Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo apt clean

    - name: Setup Tools & Dependencies
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 libssl-dev bc rsync libreadline-dev
        git config --global user.name "ZhulXD"
        git config --global user.email "zhulxd@users.noreply.github.com"
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize TWRP Tree
      run: |
        mkdir -p /home/runner/workdir
        cd /home/runner/workdir
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --git-lfs
        repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

    - name: Clone & Adapt Device Tree
      run: |
        cd /home/runner/workdir
        git clone --depth=1 https://github.com/RushilPCM/twrp_water.git -b main device/xiaomi/water
        
        TREE_DIR="device/xiaomi/water"
        
        sed -i "s|vendor/omni/config/common.mk|vendor/twrp/config/common.mk|g" $TREE_DIR/*.mk || true
        sed -i "s|omni_|twrp_|g" $TREE_DIR/*.mk || true
        
        if [ -f "$TREE_DIR/omni_water.mk" ]; then
          mv "$TREE_DIR/omni_water.mk" "$TREE_DIR/twrp_water.mk"
        fi
        
        sed -i "/PRODUCT_STATIC_BOOT_CONTROL_HAL/,+5d" $TREE_DIR/*.mk || true
        sed -i "s/PRODUCT_STATIC_BOOT_CONTROL_HAL.*//g" $TREE_DIR/*.mk || true
        
        cat << AP_EOF > $TREE_DIR/AndroidProducts.mk
PRODUCT_MAKEFILES := \
    \$(LOCAL_DIR)/twrp_water.mk

COMMON_LUNCH_CHOICES := \
    twrp_water-eng \
    twrp_water-userdebug
AP_EOF

    - name: Compile TWRP
      run: |
        cd /home/runner/workdir
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        source build/envsetup.sh
        lunch twrp_water-eng
        mka bootimage -j$(nproc --all)

    - name: Prepare Artifacts
      run: |
        mkdir -p output
        find /home/runner/workdir/out/target/product/water -name "*.img" -exec cp {} output/ \;

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-water-Images
        path: output/*
