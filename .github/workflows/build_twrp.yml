name: Build TWRP Recovery for Redmi Cloud/Water

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'Device Tree Repo'
        required: true
        default: 'https://github.com/twrpdtgen/android_device_xiaomi_water.git'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'vnd_water-user-12-SP1A.210812.016-V14.0.3.0.TGOINXM-release-keys'
      DEVICE_PATH:
        description: 'Device Path in Source'
        required: true
        default: 'device/xiaomi/water'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'water'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'bootimage'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 1024
        swap-size-mb: 10240
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Environment & Dependencies
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 libssl-dev bc
        git config --global user.name "ZhulXD"
        git config --global user.email "zhulxd@users.noreply.github.com"
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Sync TWRP Source
      run: |
        mkdir -p ${{ runner.temp }}/workdir
        cd ${{ runner.temp }}/workdir
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd ${{ runner.temp }}/workdir
        git clone --depth=1 ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

    - name: Build Recovery Target
      run: |
        cd ${{ runner.temp }}/workdir
        source build/envsetup.sh
        lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng || lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng
        mka ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc --all)

    - name: Prepare Artifacts
      run: |
        mkdir -p output
        find ${{ runner.temp }}/workdir/out/target/product/${{ github.event.inputs.DEVICE_NAME }} -name "*.img" -exec cp {} output/ \;

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-${{ github.event.inputs.DEVICE_NAME }}-Output
        path: output/*
